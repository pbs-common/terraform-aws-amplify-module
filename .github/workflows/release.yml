name: Release
on:
  push:
    branches: [ main ]
    paths:
      - '*.tf'
      - '.terraform.lock.hcl'
  # Dependabot PRs are merged with GITHUB_TOKEN, and pushes made with GITHUB_TOKEN
  # do not trigger workflows. The schedule picks up those merges.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
concurrency: release-${{ github.base_ref }}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: "Check for unreleased changes"
        id: changes
        run: |
          latest_tag="$(git tag --list | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n1)"
          if ! [[ -n "$latest_tag" ]]; then
            echo "::error::No release tag found."
            exit 1
          elif git diff --quiet "$latest_tag"..HEAD -- '*.tf' .terraform.lock.hcl; then
            echo "No Terraform changes since $latest_tag."
            echo "unreleased=false" >> "$GITHUB_OUTPUT"
          else
            echo "Terraform changes found since $latest_tag."
            echo "unreleased=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup mise
        if: steps.changes.outputs.unreleased == 'true'
        uses: jdx/mise-action@v4

      - name: "Run document script if necessary"
        if: steps.changes.outputs.unreleased == 'true'
        run: |
          if [[ "$(basename "$(git rev-parse --show-toplevel)")" != *'terraform-aws-template'* ]]; then
            ./scripts/document.sh

            echo "Setting core.fileMode to false to avoid false positives in documentation check."
            git config core.fileMode false
            if [[ -n $(git status --porcelain) ]]; then
              echo "Documentation is not up to date. Comitting updates"

              git add README.md
              git config user.name "${GITHUB_USERNAME}"
              git config user.email "${GITHUB_USERNAME}@users.noreply.github.com"
              git commit -m "Running document script"
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.actor }}

      - name: Release
        if: steps.changes.outputs.unreleased == 'true'
        run: ./scripts/release.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.actor }}
